<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ Smart Farm</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/style.css" rel="stylesheet"></head><body class="login-bg"><main class="card login-card shadow-lg"><h1 class="h4 mb-3">Smart Farm Controller Pro</h1><p class="text-muted">เข้าสู่ระบบเพื่อควบคุมฟาร์ม</p><input id="username" class="form-control mb-2" placeholder="ชื่อผู้ใช้" value="admin"><input id="password" class="form-control mb-3" placeholder="รหัสผ่าน" type="password"><button id="loginBtn" class="btn btn-success w-100">เข้าสู่ระบบ</button><div id="message" class="small mt-3 text-danger"></div></main><script>document.getElementById('loginBtn').onclick=async()=>{const r=await fetch('/api/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});const j=await r.json();if(j.ok){localStorage.csrf=j.csrf;location='/'}else message.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'};</script></body></html>
